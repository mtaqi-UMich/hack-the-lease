<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bring any listing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; box-sizing: border-box; background: #FAF8F4; color: #1D1F1A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; padding: 16px 16px 48px">
<div style="max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="Compare.dc.html" aria-label="Back to compare" style="flex: none; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 0.5px 1px rgba(29,31,26,.06), 0 3px 10px rgba(29,31,26,.08); display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1F1A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<a href="Main.dc.html" style="font-size: 15px; font-weight: 600; color: #666666; text-decoration: none">Home</a>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.03em">Bring any listing</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.45; color: #666666">Found a place somewhere else? We’ll price it the same way. It stays private to you.</p>
</div>

<div style="padding: 4px; border-radius: 999px; background: #EDEAE3; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 40px; border-radius: 999px; border: none; background: {{t.bg}}; font-family: inherit; font-size: 15px; font-weight: 600; color: {{t.fg}}; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>

<sc-if value="{{isPaste}}" hint-placeholder-val="{{ true }}">
<textarea aria-label="Listing text" style="height: 130px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(29,31,26,.14); background: #FFFFFF; padding: 14px; font-family: inherit; font-size: 16px; line-height: 1.45; color: #1D1F1A; resize: none">Sunny 2 bed / 1 bath near Kerrytown. $2,050/mo. Heat included. Coin laundry in basement. Available Aug 1.</textarea>
</sc-if>
<sc-if value="{{isShot}}" hint-placeholder-val="{{ false }}">
<button onClick="{{read}}" style="height: 130px; border-radius: 18px; border: 2px dashed rgba(29,31,26,.2); background: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; color: #5046F5; cursor: pointer">Choose a screenshot</button>
</sc-if>
<sc-if value="{{isFields}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<input aria-label="Monthly rent" placeholder="Rent" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(29,31,26,.14); padding: 0 14px; font-family: inherit; font-size: 16px">
<input aria-label="Bedrooms" placeholder="Bedrooms" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(29,31,26,.14); padding: 0 14px; font-family: inherit; font-size: 16px">
<input aria-label="Address" placeholder="Address" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(29,31,26,.14); padding: 0 14px; font-family: inherit; font-size: 16px">
<input aria-label="Utilities included" placeholder="Utilities included" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(29,31,26,.14); padding: 0 14px; font-family: inherit; font-size: 16px">
</div>
</sc-if>

<sc-if value="{{notRead}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<button onClick="{{read}}" style="height: 52px; border-radius: 999px; border: none; background: #5046F5; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Read listing</button>
<span style="text-align: center; font-size: 13px; color: #666666">We only read what you paste. We never visit the site.</span>
</div>
</sc-if>

<sc-if value="{{hasRead}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border-radius: 18px; box-shadow: 0 0.5px 1px rgba(29,31,26,.06), 0 3px 10px rgba(29,31,26,.08); padding: 20px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 17px; font-weight: 600; padding-bottom: 8px">What we found</span>
<sc-for list="{{found}}" as="f" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(29,31,26,.1)">
<span style="flex: 1; font-size: 15px; color: #666666">{{f.label}}</span>
<span style="height: 22px; padding: 0 8px; border-radius: 999px; background: {{f.bg}}; color: {{f.fg}}; font-size: 12px; font-weight: 600; display: flex; align-items: center">{{f.status}}</span>
<span style="width: 72px; text-align: right; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{f.value}}</span>
</div>
</sc-for>
<div style="margin-top: 8px; padding: 14px; border-radius: 12px; background: #F5F2EB; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 600">Missing: address. We won’t guess.</span>
<input aria-label="Address or cross streets" placeholder="Address or cross streets" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(29,31,26,.14); background: #FFFFFF; padding: 0 14px; font-family: inherit; font-size: 16px">
</div>
</div>
<a href="Compare.dc.html" style="height: 52px; border-radius: 999px; background: #5046F5; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Add to compare · $1,025 your half</a>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { tab: 'paste', done: false }; }
renderVals() {
const s = this.state;
const T = [['paste','Paste text'],['shot','Screenshot'],['fields','4 fields']];
const L = { status:'Listed', bg:'#A8F06B', fg:'#224500' };
const E = { status:'Estimated', bg:'#B7F3F7', fg:'#0A3D44' };
const U = { status:'Unknown', bg:'#F2EFE8', fg:'#1D1F1A' };
return {
tabs: T.map(([k,l]) => ({ label:l, on: s.tab===k, bg: s.tab===k ? '#FFFFFF' : 'transparent', fg: s.tab===k ? '#1D1F1A' : '#666666', pick: () => this.setState({ tab:k, done:false }) })),
isPaste: s.tab==='paste', isShot: s.tab==='shot', isFields: s.tab==='fields',
hasRead: s.done, notRead: !s.done, read: () => this.setState({ done:true }),
found: [
{ ...L, label:'Rent, whole unit', value:'$2,050' },
{ ...L, label:'Heat', value:'Included' },
{ ...E, label:'Electric + internet', value:'~$95' },
{ ...U, label:'Address', value:'—' }
]
};
}
}
</script>
</body>
</html>
