<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; box-sizing: border-box; background: #FAF8F4; color: #1D1F1A; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; padding: 16px 16px 40px">
<div style="max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">

<div style="display: flex; align-items: center; gap: 12px">
<sc-if value="{{isFirst}}" hint-placeholder-val="{{ true }}">
<a href="Main.dc.html" aria-label="Back to home" style="flex: none; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 0.5px 1px rgba(29,31,26,.06), 0 3px 10px rgba(29,31,26,.08); display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1F1A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
</sc-if>
<sc-if value="{{notFirst}}" hint-placeholder-val="{{ false }}">
<button onClick="{{back}}" aria-label="Previous question" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: none; background: #FFFFFF; box-shadow: 0 0.5px 1px rgba(29,31,26,.06), 0 3px 10px rgba(29,31,26,.08); display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1F1A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</button>
</sc-if>
<div style="flex: 1; height: 6px; border-radius: 999px; background: #E3DFD6; overflow: hidden">
<div style="height: 6px; border-radius: 999px; background: #5046F5; width: {{progress}}"></div>
</div>
<span style="font-size: 13px; font-weight: 500; color: #666666; font-variant-numeric: tabular-nums">{{stepLabel}}</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em">{{q.title}}</h1>
<p style="margin: 0; font-size: 17px; color: #666666">{{q.sub}}</p>
</div>

<sc-if value="{{isChoice}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="min-height: 60px; border-radius: 18px; border: 2px solid {{o.border}}; background: {{o.bg}}; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; font-family: inherit; font-size: 17px; font-weight: 600; color: #1D1F1A; cursor: pointer">
<span>{{o.label}}</span>
<span style="flex: none; width: 22px; height: 22px; border-radius: 999px; border: 2px solid {{o.border}}; background: {{o.dot}}"></span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isBudget}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFFFFF; border-radius: 24px; padding: 28px 24px; box-shadow: 0 0.5px 1px rgba(29,31,26,.06), 0 3px 10px rgba(29,31,26,.08); display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 44px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">${{budget}}</span><span style="font-size: 15px; color: #666666">a month</span></div>
<input aria-label="Monthly budget" type="range" min="600" max="2200" step="25" value="{{budgetRaw}}" onChange="{{onBudget}}" style="width: 100%; height: 44px; accent-color: #5046F5">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #666666"><span>$600</span><span>{{matchCount}} places fit</span><span>$2,200</span></div>
<div style="padding: 4px; border-radius: 999px; background: #EDEAE3; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
<button onClick="{{flexHard}}" style="height: 40px; border-radius: 999px; border: none; font-family: inherit; font-size: 15px; font-weight: 600; background: {{hardBg}}; color: #1D1F1A; cursor: pointer">Hard limit</button>
<button onClick="{{flexSoft}}" style="height: 40px; border-radius: 999px; border: none; font-family: inherit; font-size: 15px; font-weight: 600; background: {{softBg}}; color: #1D1F1A; cursor: pointer">Can stretch a bit</button>
</div>
</div>
</sc-if>

<sc-if value="{{isTrade}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button onClick="{{pickA}}" style="border-radius: 18px; border: 2px solid {{aBorder}}; background: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 6px; text-align: left; font-family: inherit; cursor: pointer; box-shadow: 0 0.5px 1px rgba(29,31,26,.06), 0 3px 10px rgba(29,31,26,.08)">
<span style="font-size: 28px; font-weight: 700; color: #1D1F1A; font-variant-numeric: tabular-nums">$1,050</span>
<span style="font-size: 15px; color: #666666">8 min walk</span>
</button>
<button onClick="{{pickB}}" style="border-radius: 18px; border: 2px solid {{bBorder}}; background: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 6px; text-align: left; font-family: inherit; cursor: pointer; box-shadow: 0 0.5px 1px rgba(29,31,26,.06), 0 3px 10px rgba(29,31,26,.08)">
<span style="font-size: 28px; font-weight: 700; color: #1D1F1A; font-variant-numeric: tabular-nums">$880</span>
<span style="font-size: 15px; color: #666666">26 min by bus</span>
</button>
</div>
</sc-if>

<sc-if value="{{isMulti}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="8">
<button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: none; font-family: inherit; font-size: 15px; font-weight: 600; background: {{c.bg}}; color: {{c.fg}}; cursor: pointer; box-shadow: 0 0.5px 1px rgba(29,31,26,.06), 0 3px 10px rgba(29,31,26,.08)">{{c.label}}</button>
</sc-for>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 14px; padding-top: 8px">
<sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
<button onClick="{{next}}" style="height: 52px; border-radius: 999px; border: none; background: #5046F5; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Continue</button>
</sc-if>
<sc-if value="{{isLast}}" hint-placeholder-val="{{ false }}">
<a href="IdCard.dc.html" style="height: 52px; border-radius: 999px; background: #5046F5; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">See my housing ID</a>
</sc-if>
<span style="text-align: center; font-size: 13px; color: #666666">{{q.why}}</span>
</div>

<div style="display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid rgba(29,31,26,.12)">
<button onClick="{{openMore}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: none; background: transparent; color: #5046F5; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Something else matters?</button>
<button onClick="{{openSched}}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: none; background: transparent; color: #666666; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Import class schedule</button>
</div>
</div>

<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(29,31,26,.35); display: flex; align-items: flex-end; justify-content: center; z-index: 10">
<div role="dialog" aria-label="{{sheetTitle}}" style="width: 100%; max-width: 560px; box-sizing: border-box; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em">{{sheetTitle}}</span>
<button onClick="{{closeSheet}}" aria-label="Close" style="width: 36px; height: 36px; border-radius: 999px; border: none; background: #F2EFE8; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D1F1A" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<span style="font-size: 15px; color: #666666; line-height: 1.45">{{sheetBody}}</span>
<sc-if value="{{isMore}}" hint-placeholder-val="{{ false }}">
<input aria-label="What else matters" placeholder="e.g. near a mosque, ground floor, gym in building" style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid rgba(29,31,26,.14); padding: 0 14px; font-family: inherit; font-size: 16px">
</sc-if>
<button onClick="{{closeSheet}}" style="height: 52px; border-radius: 999px; border: none; background: #5046F5; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">{{sheetCta}}</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { step: 0, ans: {}, budget: 1150, soft: true, trade: null, picks: ['walk','laundry'], sheet: null }; }
renderVals() {
const s = this.state;
const Q = [
{ id:'group', title:'Who are you living with?', sub:'This decides per-bed or whole-unit leases.', why:'Asked first — it rules out about half the listings.', opts:[['alone','Just me'],['friend','Me + 1 friend'],['group','A group of 3+'],['match','Match me with roommates']] },
{ id:'mode', title:'How will you get to class?', sub:'We use real bus schedules, not distance.', why:'We skipped “Need parking?” — this answer predicts it.', opts:[['walk','Walk'],['bus','Bus (free with MCard)'],['bike','Bike'],['car','Car']] },
{ id:'campus', title:'Where are most of your classes?', sub:'Or import your schedule below.', why:'Your top 3 still differ on this, so it’s worth one tap.', opts:[['central','Central Campus'],['north','North Campus'],['med','Medical Campus'],['mixed','A mix']] },
{ id:'budget', title:'What can you spend?', sub:'Your share, including utilities and fees.', why:'We rank on true monthly cost, so hidden fees can’t sneak in.' },
{ id:'trade', title:'Which would you pick?', sub:'Same size, same quality.', why:'One tap tells us what your time is worth to you.' },
{ id:'must', title:'What won’t you compromise on?', sub:'Pick up to 3.', why:'Last one. We’re now 95% sure your best match is in your top 3.' }
];
const q = Q[s.step];
const sel = s.ans[q.id];
const opts = (q.opts||[]).map(([v,l]) => ({ label:l, on: sel===v, border: sel===v ? '#5046F5' : 'transparent', bg: sel===v ? '#EEEDFE' : '#FFFFFF', dot: sel===v ? '#5046F5' : '#FFFFFF', pick: () => this.setState({ ans: { ...s.ans, [q.id]: v } }) }));
const C = [['walk','Safe walk home at night'],['quiet','Quiet'],['laundry','In-unit laundry'],['ac','AC'],['pets','Pets OK'],['parking','Parking'],['short','Short lease'],['nofees','No surprise fees']];
const chips = C.map(([v,l]) => { const on = s.picks.includes(v); return { label:l, on, bg: on ? '#5046F5' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1D1F1A', pick: () => { let p = on ? s.picks.filter(x=>x!==v) : [...s.picks, v]; if (p.length>3) p = p.slice(1); this.setState({ picks: p }); } }; });
const sheets = {
more: { t:'Something else matters?', b:'Tell us in your own words. We turn it into a filter and show how many places still fit.', c:'Add it' },
sched: { t:'Import your class schedule', b:'Optional. Paste your Wolverine Access schedule or connect your calendar, and we time your commute to each class.', c:'Maybe later' }
};
const sh = s.sheet ? sheets[s.sheet] : null;
return {
q, opts, chips,
isChoice: !!q.opts, isBudget: q.id==='budget', isTrade: q.id==='trade', isMulti: q.id==='must',
isFirst: s.step===0, notFirst: s.step>0,
isLast: s.step===Q.length-1, notLast: s.step<Q.length-1,
progress: Math.round((s.step+1)/Q.length*100)+'%', stepLabel: (s.step+1)+' of '+Q.length,
budget: s.budget.toLocaleString('en-US'), budgetRaw: s.budget, matchCount: Math.max(4, Math.round((s.budget-600)/1600*120)),
onBudget: (e) => this.setState({ budget: Number(e.target.value) }),
hardBg: s.soft ? 'transparent' : '#FFFFFF', softBg: s.soft ? '#FFFFFF' : 'transparent',
flexHard: () => this.setState({ soft:false }), flexSoft: () => this.setState({ soft:true }),
aBorder: s.trade==='a' ? '#5046F5' : 'transparent', bBorder: s.trade==='b' ? '#5046F5' : 'transparent',
pickA: () => this.setState({ trade:'a' }), pickB: () => this.setState({ trade:'b' }),
next: () => this.setState({ step: Math.min(Q.length-1, s.step+1) }),
back: () => this.setState({ step: Math.max(0, s.step-1) }),
sheetOpen: !!sh, isMore: s.sheet==='more',
sheetTitle: sh ? sh.t : '', sheetBody: sh ? sh.b : '', sheetCta: sh ? sh.c : '',
openMore: () => this.setState({ sheet:'more' }), openSched: () => this.setState({ sheet:'sched' }), closeSheet: () => this.setState({ sheet:null })
};
}
}
</script>
</body>
</html>
